<!doctype html><html lang="es"><meta charset="utf-8"><title>USF · Pruebas</title><style>body{background:#09121b;color:#e4f6ee;font:15px system-ui;margin:28px}button{padding:12px;cursor:pointer}li{margin:8px}iframe{width:960px;height:600px;border:0;max-width:100%}.fail{color:#ff657a}.pass{color:#54ecad}</style><h1>Pruebas de regresión · USF</h1><p>Controles, física, reglas y ciclo del partido. Abrir desde el mismo servidor que el juego.</p><button id="run">Ejecutar pruebas</button><p id="summary">Cargando…</p><ol id="results"></ol><iframe id="game" src="../index.html"></iframe><script>
const frame=document.getElementById('game'),button=document.getElementById('run');button.disabled=true;
frame.onload=()=>{button.disabled=false;document.getElementById('summary').textContent='Listo para comprobar.'};
button.onclick=()=>{const w=frame.contentWindow;const script=w.document.createElement('script');script.src='tests/regression.js';script.onload=()=>{const results=w.runRegression();document.getElementById('summary').textContent=results.filter(r=>r.ok).length+' / '+results.length+' pruebas correctas';document.getElementById('results').replaceChildren(...results.map(r=>{const li=document.createElement('li');li.className=r.ok?'pass':'fail';li.textContent=(r.ok?'✓ ':'✕ ')+r.name+(r.error?' — '+r.error:'');return li;}));};w.document.body.append(script);};
</script></html>
